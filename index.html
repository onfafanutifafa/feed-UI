<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="styles.css">
    <title>Feedback UI</title>
</head>
<body>
    <div id="panel" class="panel-container">
        <strong>Feedback Panel <br>
        customer support performance?</strong>
        <div class="ratings-container">
            <div class="rating">
                <img width="48" height="48" src="https://img.icons8.com/color/48/sad--v2.png" alt="sad--v2"/>
                <small>unsatisfied</small>
            </div>
            <div class="rating">
                <img width="48" height="48" src="https://img.icons8.com/emoji/48/neutral-face.png" alt="neutral-face"/>
                <small>unsatisfied</small>
            </div>
            <div class="rating">
                <img width="48" height="48" src="https://img.icons8.com/fluency/48/happy.png" alt="happy"/>
                <small>satisfied</small>
            </div>
        </div>
        <div>
            <button class="btn" id="send">
                send review.
            </button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
